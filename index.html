<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- M4/T5 — PWA wiring: the house installs to the home screen and lives in
         the same indigo night on every OS chrome that reads it. -->
    <meta name="theme-color" content="#0b1026" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Mirror House</title>
    <!-- step007/T1 — launch meta: the one-line pitch for crawlers and share
         cards. og:image is a DIRECT PNG url (crawlers do not run JS and most
         do not follow /assets hashes) — public/og-image.png, a copy of
         store-assets/icon-512.png committed at the repo root, referenced
         absolutely against the production origin. -->
    <meta
      name="description"
      content="Escape a century-old palace of mirrors: fog the glass, outthink what hunts you, descend. Free, open source, offline — your data never leaves your device."
    />
    <meta property="og:title" content="Mirror House" />
    <meta
      property="og:description"
      content="Escape a century-old palace of mirrors: fog the glass, outthink what hunts you, descend. Free, open source, offline — your data never leaves your device."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mirror-house.seolith.com/" />
    <meta property="og:image" content="https://mirror-house.seolith.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ui-pod — self-hosted fonts (SIL OFL; PROVENANCE.md). Preload the three
         files the first paint needs (the boot poster's Big Shoulders Display,
         the body's Mukta 400/600); every other subset loads on demand through
         its unicode-range. NO remote loads — the CSP allows font-src 'self'
         only and the SW precaches every file. -->
    <link rel="preload" href="/fonts/bsd-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/mukta-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/mukta-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* ============================================================
         ui-pod — the People-of-Delhi chrome
         The frame around the wardens' world re-dresses in our sibling
         project's design language: ink plates, cream type, one yellow
         accent, Big Shoulders Display as the voice (kickers, titles,
         buttons, chips, keys) and Mukta as the body — Devanagari-native,
         so the Hindi chrome finally gets proper type. The 3D stage, the
         tier scene palettes and every id/aria contract are untouched:
         this stylesheet only re-dresses the chrome around them.
         ============================================================ */

         Google serves one variable latin file for all three weights; each
         @font-face pins the weight exactly as fonts.googleapis.com does. */

        font-family: 'Big Shoulders Display';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/bsd-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,

      /* -- The PoD token row: ink depth, cream type, one yellow accent -- */
      :root {
        --ink: #1b1a24;
        --ink-2: #26243a;
        --ink-3: #343150;
        --cream: #fff4e2;
        --muted: #b9b2c9;
        --yellow: #ffc20e;
        --blue: #1f5ba8;
        --red: #d7262d;
        --green: #1f9a55;
        --pink: #e5609b;
        --magenta: #9b2a8d;
        --sand: #b5532e;
        --accent: var(--yellow);
        --r: 4px;
        --display: 'Big Shoulders Display', Mukta, system-ui, sans-serif;
        --body: Mukta, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --plate: #1b1a24db; /* hud chips + keys bar */
        --plate-solid: #1b1a24f2; /* panels */
        --edge: rgba(255, 255, 255, 0.1);
      }
      /* M5/T1 — the text-scale ladder every HUD/overlay font multiplies in.
         main.ts sets the inline body value from the save (1 | 1.25 | 1.5);
         this default keeps a no-JS first paint at 100%. */
      html {
        --mh-text-scale: 1;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Overhead/tactical map (M3/T4) — a 2D canvas over the paused 3D stage.
         display:none unless the view mode is overhead/tactical (main.ts owns
         the toggle); above #game, below the HUD and diagnostics. */
      #overhead {
        position: fixed;
        inset: 0;
        z-index: 5;
        width: 100vw;
        height: 100vh;
        display: none;
        background: #05060a;
        cursor: crosshair;
      }
      /* ui-pod — the scene vignette: a static, aria-hidden radial shade over
         the 3D stage (below the overhead map and the HUD, above the canvas).
         Pure decoration — pointer-events:none, no DOM from main.ts. */
      #mh-vignette {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(10, 9, 16, 0.42) 100%);
      }
      /* ui-pod — the boot poster (the one PR moment): kicker MIRROR, the
         giant HOUSE, the tagline — the PoD boot composition, left 6vw /
         bottom 16vh. Statically marked so it paints from the first parse;
         main.ts owns the once-per-session clock and the removal. Never a
         gate: pointer-events:none and no focusable children, ever. */
      #mh-boot {
        position: fixed;
        left: 6vw;
        bottom: 16vh;
        z-index: 40;
        pointer-events: none;
        color: var(--cream);
      }
      #mh-boot .mh-boot-kicker {
        font: 700 calc(20px * var(--mh-text-scale, 1)) / 1 var(--display);
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent);
      }
      #mh-boot .mh-boot-title {
        font: 900 calc(clamp(88px, 16vw, 210px) * var(--mh-text-scale, 1)) / 0.82 var(--display);
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 6px 30px #00000073;
      }
      #mh-boot .mh-boot-tagline {
        margin: 10px 0 0;
        font: 400 calc(18px * var(--mh-text-scale, 1)) / 1.4 var(--body);
        color: var(--muted);
      }
      #mh-boot.mh-boot-hide {
        opacity: 0;
        transition: opacity 320ms ease;
      }
      /* the poster's entrance is motion, so reduced-flash stands it still */
      body:not(.mh-reduced-flash) #mh-boot {
        animation: mh-boot-in 420ms ease-out;
      }
      @keyframes mh-boot-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* dev diagnostics + the tester chip keep their monospace read-out, on
         PoD plates; the diagnostics step below the district plate, the tester
         chip steps above the keys bar. */
      #diagnostics {
        position: fixed;
        top: 132px;
        left: 8px;
        z-index: 10;
        font:
          calc(12px * var(--mh-text-scale, 1)) / 1.5 ui-monospace,
          monospace;
        color: var(--muted);
        background: var(--plate);
        padding: 6px 10px;
        border-radius: var(--r);
        pointer-events: none;
        white-space: pre;
      }
      /* step007/T3 — the TESTER chip (?test=1 only; main.ts creates it, so a
         default load never carries the element): docked bottom-left, ABOVE
         the keys bar AND (since t11) the minimap AND (t11/T2) the motion
         pane, teal text naming its nature. */
      #mh-tester {
        position: fixed;
        bottom: 432px;
        left: 8px;
        z-index: 10;
        font:
          calc(12px * var(--mh-text-scale, 1)) / 1.5 ui-monospace,
          monospace;
        color: #2ec4b6;
        background: var(--plate);
        padding: 6px 10px;
        border-radius: var(--r);
        pointer-events: none;
        white-space: pre;
      }
      /* step007/T3 — tester mode's one-time banner: top-center, teal-edged
         like the diagnostics family; main.ts flips [hidden] after 6s. */
      #mh-tester-banner {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        max-width: min(480px, 90vw);
        background: var(--plate-solid);
        border: 1px solid #2ec4b6;
        border-radius: var(--r);
        padding: 8px 14px;
        font: calc(13px * var(--mh-text-scale, 1)) / 1.5 var(--body);
        color: var(--cream);
        text-align: center;
        pointer-events: none;
      }
      #mh-tester-banner[hidden] {
        display: none;
      }
      /* ============================================================
         THE HUD FRAME — #hud is the fixed inset-0 chrome layer; the PoD
         zones position inside it. The whole frame is pointer-events:none;
         only the buttons re-arm clicks.
         ============================================================ */
      #hud {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font: calc(13px * var(--mh-text-scale, 1)) / 1.4 var(--body);
        color: var(--cream);
      }
      /* ui-pod — every HUD button is the PoD ghost: dark-alpha fill, hairline
         white border, display font 800, uppercase, 1px tracking. */
      #hud button {
        pointer-events: auto;
        cursor: pointer;
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 4px 12px;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      #hud button:hover:not(:disabled) {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* active = the PoD tab answer: solid yellow, ink text, hard shadow */
      #hud button.active {
        background: var(--yellow);
        border-color: var(--yellow);
        color: var(--ink);
        box-shadow: 0 3px #b88a00;
      }
      #hud button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* ui-pod — THE DISTRICT PLATE (top-left): skewed ink plate, accent
         edge on the left, kicker / big display number / accent area line.
         #mh-floor keeps its exact text contract (the e2e reads it); the
         plate only re-dresses it. */
      #mh-district {
        position: absolute;
        top: 14px;
        left: 14px;
        transform: skew(-9deg);
        background: #1b1a24e0;
        border-left: 5px solid var(--accent);
        padding: 8px 18px 10px 14px;
      }
      #mh-district-kicker {
        font: 700 calc(11px * var(--mh-text-scale, 1)) / 1 var(--display);
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      #mh-floor {
        margin: 3px 0 2px;
        font: 900 calc(30px * var(--mh-text-scale, 1)) / 0.9 var(--display);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--cream);
      }
      #mh-floor-area {
        font: 800 calc(12px * var(--mh-text-scale, 1)) / 1 var(--display);
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
      }
      /* ui-pod — THE KEYS BAR (bottom-left): kbd hints, display font, skewed
         keys, live from the save's keymap. aria-hidden; pointer-events:none. */
      #mh-keys {
        position: absolute;
        bottom: 14px;
        left: 14px;
        display: flex;
        gap: 14px;
        align-items: center;
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 6px 14px;
        pointer-events: none;
      }
      #mh-keys .mh-key-hint {
        display: flex;
        gap: 6px;
        align-items: center;
        font: 600 calc(12px * var(--mh-text-scale, 1)) var(--body);
        color: var(--cream);
        white-space: nowrap;
      }
      #mh-keys kbd {
        transform: skew(-9deg);
        font: 800 calc(12px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1px;
        color: var(--ink);
        background: var(--cream);
        border-radius: 3px;
        padding: 1px 7px;
      }
      /* t11 — THE PAC-MINIMAP (bottom-left, above the keys bar): the full
         maze as a Pac-Man-style guide on a PoD dark plate. The canvas paints
         its own inner bezel every repaint; the plate chrome here is the
         border/blur frame. Never a gate: pointer-events:none (the pane is a
         poster, the dock's MAP chip + KeyN own the toggling). */
      #mh-minimap {
        position: absolute;
        bottom: 64px;
        left: 14px;
        width: 176px;
        height: 176px;
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        pointer-events: none;
      }
      /* t11/T2 — THE MOTION PANE (the robotic mirror): the bottom-left pane
         column's second floor, stacked above the minimap (64 + 176 + 12 gap).
         Same PoD plate chrome as its sibling; the canvas paints its own bezel
         + figure + compass every frame. Never a gate: pointer-events:none
         (the dock's MOTION chip + KeyB own the toggling). */
      #mh-motion {
        position: absolute;
        bottom: 252px;
        left: 14px;
        width: 132px;
        height: 168px;
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        pointer-events: none;
      }
      /* ui-pod — HUD-META (top-right): the value chips as dark blurred plates. */
      #mh-chips {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        max-width: min(520px, 56vw);
        pointer-events: none;
      }
      .mh-chip {
        white-space: nowrap;
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 3px 10px;
        font: 600 calc(13px * var(--mh-text-scale, 1)) var(--body);
        color: var(--cream);
      }
      /* ui-pod — the venue side-floor banner: a rose-edged plate under the
         meta chips (the pack's accent family; the card rides the
         pointer-events:none frame, its button alone owns clicks). */
      #mh-venue {
        position: absolute;
        top: 110px;
        right: 14px;
        max-width: 300px;
        background: var(--plate-solid);
        border: 1px solid var(--pink);
        border-left: 5px solid var(--pink);
        border-radius: var(--r);
        padding: 8px 12px;
        font-size: calc(13px * var(--mh-text-scale, 1));
        text-align: right;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #mh-venue[hidden] {
        display: none;
      }
      #mh-venue p {
        margin: 2px 0;
        color: var(--cream);
      }
      #mh-venue .mh-venue-note {
        color: var(--muted);
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-venue button {
        pointer-events: auto;
        cursor: pointer;
        margin: 4px 0 0;
        background: var(--yellow);
        color: var(--ink);
        border: 1px solid var(--yellow);
        border-radius: var(--r);
        box-shadow: 0 3px #b88a00;
        padding: 4px 12px;
        font: 800 calc(12px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      #mh-venue button:hover {
        border-color: var(--yellow);
        color: var(--ink);
      }
      /* "Your venue here?" — the sponsor door, on the one banner a venue
         owner trying the demo is already reading. */
      #mh-venue a {
        pointer-events: auto;
        display: block;
        margin-top: 6px;
        color: var(--yellow);
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      /* ui-pod — THE DOCK (bottom-right): view chip, the mode/lang row, the
         two bars, then the action buttons — every id unchanged, only moved. */
      #mh-dock {
        position: absolute;
        bottom: 14px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        max-width: min(420px, 70vw);
        pointer-events: none;
      }
      /* final review — #mh-view is deliberately NOT re-armed here: the view
         chip is a read-only indicator, not a control, so it stays
         pointer-events:none with its #mh-dock parent (its own rule pins it). */
      #mh-dock button {
        pointer-events: auto;
      }
      #mh-modes {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: flex-end;
      }
      #mh-view {
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 3px 10px;
        font: 600 calc(13px * var(--mh-text-scale, 1)) var(--body);
        color: var(--cream);
        white-space: nowrap;
        pointer-events: none;
      }
      #mh-breath {
        width: 150px;
        height: 10px;
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: 5px;
        overflow: hidden;
      }
      #mh-breath-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #9fd8ff, #d7f1ff);
        transition: width 0.15s linear;
      }
      #mh-anger {
        width: 150px;
        height: 10px;
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: 5px;
        overflow: hidden;
      }
      #mh-anger-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7a2f35, #e07a5f);
        transition: width 0.15s linear;
      }
      /* ui-pod — the top-center notice column: the transient banners keep
         their stacking (several can be live at once) as accent-edged plates. */
      #mh-notices {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        max-width: min(480px, 80vw);
        pointer-events: none;
      }
      #mh-cleared,
      #mh-descend,
      #mh-fail,
      #mh-hint,
      #mh-toast {
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 6px 14px;
        font: 600 calc(13px * var(--mh-text-scale, 1)) var(--body);
        color: var(--cream);
        text-align: center;
        pointer-events: none;
      }
      #mh-cleared {
        border-left: 5px solid var(--yellow);
        font-size: calc(15px * var(--mh-text-scale, 1));
      }
      #mh-descend {
        border-left: 5px solid var(--green);
        font-size: calc(15px * var(--mh-text-scale, 1));
      }
      #mh-fail {
        border-left: 5px solid var(--red);
        font-size: calc(15px * var(--mh-text-scale, 1));
      }
      #mh-hint {
        border-left: 5px solid var(--blue);
        max-width: 360px;
      }
      #mh-toast {
        border-left: 5px solid var(--magenta);
      }
      #mh-cleared[hidden],
      #mh-descend[hidden],
      #mh-fail[hidden],
      #mh-hint[hidden],
      #mh-toast[hidden] {
        display: none;
      }
      /* T2/T5 — the Truth-Shard I interstitial (the T1 adjudication): the
         tier-complete card's visual language — ink plate, accent edge, the
         shard line in yellow — as a centered banner that auto-dismisses from
         hud.ts after 1.8s. No backdrop and no pointer events: the 0.8s descend
         beneath it keeps running, and only Dwaar II (floor 20) raises the
         full tier screen. */
      #mh-shard {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
        max-width: min(480px, 90vw);
        background: var(--plate-solid);
        border: 1px solid var(--edge);
        border-left: 5px solid var(--yellow);
        border-radius: var(--r);
        padding: 18px 26px;
        color: var(--yellow);
        font: calc(19px * var(--mh-text-scale, 1)) / 1.6 var(--body);
        text-align: center;
        pointer-events: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #mh-shard[hidden] {
        display: none;
      }
      /* T5/T1 — the Act II opening banner: the act's name over its one-line
         threat, the shard interstitial's centered-card shape dressed in the
         act close's rose — the act-turn tint. Auto-dismisses from hud.ts
         after 3s; raised once per session on the first floor-41 build. */
      #mh-act {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
        max-width: min(480px, 90vw);
        background: var(--plate-solid);
        border: 1px solid var(--edge);
        border-left: 5px solid var(--pink);
        border-radius: var(--r);
        padding: 16px 26px 14px;
        color: var(--cream);
        font: calc(15px * var(--mh-text-scale, 1)) / 1.6 var(--body);
        text-align: center;
        pointer-events: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #mh-act-title {
        color: var(--pink);
        font: 900 calc(20px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      #mh-act-note {
        margin: 6px 0 0;
        color: var(--muted);
      }
      #mh-act[hidden] {
        display: none;
      }
      /* ============================================================
         PANELS — the PoD panel: solid-ink plate, 5px accent top edge,
         backdrop blur, 180ms slide-in; headers in yellow display type.
         ============================================================ */
      @keyframes mh-panel-in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #mh-faq-overlay,
      #mh-settings-overlay,
      #mh-about-overlay,
      #mh-feedback-overlay,
      #mh-tier-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(11, 10, 18, 0.66);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
      }
      #mh-faq-overlay[hidden],
      #mh-settings-overlay[hidden],
      #mh-about-overlay[hidden],
      #mh-feedback-overlay[hidden],
      #mh-tier-overlay[hidden] {
        display: none;
      }
      #mh-faq-box,
      #mh-settings-box,
      #mh-about-box,
      #mh-feedback-box,
      #mh-tier-box {
        background: var(--plate-solid);
        border: 1px solid var(--edge);
        border-top: 5px solid var(--accent);
        border-radius: var(--r);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: var(--cream);
        animation: mh-panel-in 180ms ease-out;
      }
      #mh-faq-box h2,
      #mh-settings-box h2,
      #mh-about-box h2,
      #mh-feedback-box h2,
      #mh-tier-box h2 {
        font: 900 calc(20px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
      }
      #mh-faq-box summary,
      #mh-aaina-box summary {
        cursor: pointer;
        color: var(--cream);
        font-weight: 600;
      }
      #mh-faq-box summary:hover,
      #mh-aaina-box summary:hover {
        color: var(--yellow);
      }
      /* M4/T2 — tier-complete screen: Truth-Shard I, final stats, Play again /
         Stay. A modal in the FAQ's image, above the HUD. */
      #mh-tier-box {
        padding: 24px 30px;
        font: calc(15px * var(--mh-text-scale, 1)) / 1.6 var(--body);
        text-align: center;
        max-width: 480px;
      }
      #mh-tier-box h2 {
        margin: 0 0 10px;
        font-size: calc(22px * var(--mh-text-scale, 1));
      }
      #mh-tier-box p {
        margin: 6px 0;
      }
      #mh-tier-note {
        color: var(--muted);
        font-size: calc(13px * var(--mh-text-scale, 1));
      }
      /* T4/T1 — the ACT I completion screen Dwaar IV raises: the same
         tier-complete card dressed in the carnival's rose (the act close, not
         a tier screen — gold stays the tiers'). */
      #mh-tier-box.act {
        border-top-color: var(--pink);
        box-shadow: 0 0 28px rgba(229, 96, 155, 0.35);
      }
      #mh-tier-box.act h2 {
        color: var(--pink);
        letter-spacing: 2px;
      }
      #mh-tier-box.act #mh-tier-note {
        color: var(--yellow);
      }
      /* T10/T3 — the GROUND DOOR finale: the same tier-complete card dressed
         in the Foundations' stone — the sand accent, the gold door light,
         the closing line in the palette's ivory. The ending, not a tier
         close: no rose, no shard-gold chrome. */
      #mh-tier-box.ground {
        border-top-color: var(--sand);
        box-shadow: 0 0 28px rgba(255, 194, 14, 0.4);
      }
      #mh-tier-box.ground h2 {
        color: var(--yellow);
        letter-spacing: 2px;
      }
      #mh-tier-box.ground #mh-tier-note {
        color: var(--cream);
      }
      #mh-tier-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 14px 0 4px;
      }
      #mh-tier-buttons button {
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 8px 16px;
        cursor: pointer;
        font: 800 calc(13px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-tier-buttons button:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* the PoD primary: solid yellow, ink text, hard shadow, no fluff */
      #mh-tier-again {
        background: var(--yellow);
        border-color: var(--yellow);
        color: var(--ink);
        box-shadow: 0 3px #b88a00;
      }
      #mh-tier-again:hover {
        border-color: var(--yellow);
        color: var(--ink);
      }
      /* M5/T3 — the caption bar: bottom-center, the latest two sound-cue
         lines (renderCaptions joins them with \n; pre-line stacks them).
         Fixed inside the pointer-events:none #hud frame, so it centres on the
         viewport whatever the zones do, and its font rides the text-scale
         ladder like every HUD surface. */
      #mh-captions {
        position: fixed;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(560px, 90vw);
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 8px 14px;
        font: calc(15px * var(--mh-text-scale, 1)) / 1.5 var(--body);
        color: var(--cream);
        text-align: center;
        white-space: pre-line;
        pointer-events: none;
      }
      #mh-captions[hidden] {
        display: none;
      }
      #mh-faq-box {
        max-width: 640px;
        max-height: 82vh;
        overflow: auto;
        padding: 20px 26px;
        font: calc(14px * var(--mh-text-scale, 1)) / 1.6 var(--body);
      }
      #mh-faq-box h2 {
        margin: 0 0 12px;
        font-size: calc(22px * var(--mh-text-scale, 1));
      }
      #mh-faq-box details {
        border-bottom: 1px solid var(--edge);
        padding: 8px 0;
      }
      #mh-faq-box button {
        margin-top: 14px;
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 6px 14px;
        cursor: pointer;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-faq-box button:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* Aaina (M3) — the FAQ's sister. ui-pod: she takes the centered panel
         shape too (ink plate, accent top, blur backdrop — the floor still
         ghosts through the light veil). */
      #mh-aaina-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(11, 10, 18, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        pointer-events: auto;
      }
      #mh-aaina-overlay[hidden] {
        display: none;
      }
      #mh-aaina-box {
        flex: 0 1 480px;
        max-width: min(480px, 92vw);
        max-height: 82vh;
        overflow: auto;
        padding: 16px 20px;
        font: calc(14px * var(--mh-text-scale, 1)) / 1.6 var(--body);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #mh-aaina-box h2 {
        margin: 0;
        font-size: calc(21px * var(--mh-text-scale, 1));
      }
      #mh-aaina-tabs {
        display: flex;
        gap: 6px;
      }
      /* ui-pod tabs: flat dark-alpha, active = solid yellow + ink text */
      #mh-aaina-tabs button {
        background: #ffffff0f;
        color: var(--cream);
        border: 1px solid transparent;
        border-radius: var(--r);
        padding: 4px 14px;
        cursor: pointer;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      #mh-aaina-tabs button.active {
        background: var(--yellow);
        color: var(--ink);
        box-shadow: 0 3px #b88a00;
      }
      #mh-aaina-box details {
        border-bottom: 1px solid var(--edge);
        padding: 6px 0;
      }
      #mh-aaina-hint-text {
        white-space: pre-wrap;
      }
      #mh-aaina-buy {
        align-self: flex-start;
        background: var(--yellow);
        color: var(--ink);
        border: 1px solid var(--yellow);
        border-radius: var(--r);
        box-shadow: 0 3px #b88a00;
        padding: 6px 14px;
        cursor: pointer;
        font: 800 calc(13px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      #mh-aaina-buy:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #mh-aaina-lore-count {
        color: var(--yellow);
        margin: 0;
      }
      #mh-aaina-lore-list p {
        margin: 6px 0;
      }
      #mh-aaina-lore-list p.locked {
        color: var(--muted);
        font-style: italic;
      }
      #mh-aaina-close {
        align-self: flex-start;
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 6px 14px;
        cursor: pointer;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-aaina-close:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* ⚙ Settings (M5/T1) — the FAQ overlay's modal shape. Two sections this
         milestone: Display (text scale radio) and Access (reduced-flash +
         captions toggles). Performance lands in T4 and Controls in T2 — no
         stub sections until then. */
      #mh-settings-box {
        min-width: 300px;
        max-width: 440px;
        max-height: 82vh;
        overflow: auto;
        padding: 20px 26px;
        font: calc(14px * var(--mh-text-scale, 1)) / 1.6 var(--body);
      }
      #mh-settings-box h2 {
        margin: 0 0 12px;
        font-size: calc(22px * var(--mh-text-scale, 1));
      }
      #mh-settings-box h3 {
        margin: 12px 0 6px;
        color: var(--cream);
        font: 800 calc(15px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      #mh-settings-box fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }
      #mh-settings-box legend {
        padding: 0;
        color: var(--cream);
      }
      #mh-settings-box label {
        display: block;
        margin: 4px 0;
        cursor: pointer;
      }
      #mh-settings-box .mh-settings-note {
        margin: 2px 0 8px;
        color: var(--muted);
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-settings-box button {
        margin-top: 10px;
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 6px 14px;
        cursor: pointer;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-settings-box button:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* M5/T2 — Controls rows: action label left, the bound key right. Click
         arms the capture (gold italic "press a key…"), the next keydown
         rebinds through the conflict guard; refusals name the owner inline. */
      #mh-settings-box .mh-key-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 0;
      }
      #mh-settings-box .mh-key-label {
        flex: 1;
      }
      #mh-settings-box .mh-key-btn {
        margin-top: 0;
        min-width: 76px;
        padding: 3px 10px;
        font-family: ui-monospace, monospace;
        text-align: center;
      }
      #mh-settings-box .mh-key-btn.mh-key-capturing {
        border-color: var(--yellow);
        color: var(--yellow);
        font-style: italic;
      }
      #mh-keymap-msg.mh-key-conflict {
        color: #e07a5f;
      }
      /* M6/T1 — the Floors section's venue card: one bordered card naming the
         DEMO pack, its Play/Return button, and the never-touches note. */
      #mh-settings-box .mh-venue-card {
        border: 1px solid var(--edge);
        border-radius: var(--r);
        padding: 8px 12px;
        margin: 4px 0 8px;
      }
      #mh-settings-box .mh-venue-card .mh-venue-name {
        color: var(--cream);
      }
      #mh-settings-box .mh-venue-card button {
        margin-top: 6px;
      }
      /* step007/T1 — the About overlay: the settings modal's shape (centered,
         accent-titled box), holding the version line, the two-line pitch, the
         beta/credits notes, the four launch links and the tagline. */
      #mh-about-box {
        min-width: 300px;
        max-width: 480px;
        max-height: 82vh;
        overflow: auto;
        padding: 20px 26px;
        font: calc(14px * var(--mh-text-scale, 1)) / 1.6 var(--body);
      }
      #mh-about-box h2 {
        margin: 0 0 6px;
        font-size: calc(22px * var(--mh-text-scale, 1));
      }
      #mh-about-version {
        margin: 0 0 10px;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-about-box p {
        margin: 8px 0;
      }
      #mh-about-links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin: 12px 0 4px;
      }
      #mh-about-links a {
        color: var(--yellow);
      }
      /* The support row: the house's two income doors (host a floor, and a
         donation link when the build carries one). */
      #mh-about-support {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin: 4px 0;
      }
      #mh-about-support a {
        color: var(--pink);
      }
      #mh-about-tagline {
        color: var(--muted);
        font-style: italic;
      }
      #mh-about-box button {
        margin-top: 12px;
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 6px 14px;
        cursor: pointer;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-about-box button:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* step007/T2 — the 📮 feedback composer: the About modal's shape holding
         a form — the kind radio (🐞/💡/💙), the short title, the body textarea
         (prompt + diagnostics prefilled, monospace so the block reads), the
         privacy line, and the two exit anchors. */
      #mh-feedback-box {
        min-width: 300px;
        max-width: 560px;
        max-height: 86vh;
        overflow: auto;
        padding: 20px 26px;
        font: calc(14px * var(--mh-text-scale, 1)) / 1.6 var(--body);
      }
      #mh-feedback-box h2 {
        margin: 0 0 8px;
        font-size: calc(22px * var(--mh-text-scale, 1));
      }
      #mh-feedback-kind {
        border: 0;
        padding: 0;
        margin: 0 0 6px;
      }
      #mh-feedback-kind legend {
        color: var(--muted);
        padding: 0;
        margin-bottom: 4px;
      }
      #mh-feedback-kind label {
        display: inline-block;
        margin: 0 14px 0 0;
        white-space: nowrap;
      }
      #mh-feedback-box label {
        display: block;
        margin: 6px 0 2px;
        color: var(--muted);
      }
      #mh-feedback-kind label {
        color: inherit;
      }
      #mh-feedback-summary,
      #mh-feedback-body {
        width: 100%;
        box-sizing: border-box;
        background: var(--ink-2);
        color: var(--cream);
        border: 1px solid var(--edge);
        border-radius: var(--r);
        font: inherit;
        padding: 6px 8px;
      }
      #mh-feedback-body {
        resize: vertical;
        min-height: 9em;
        font-family: ui-monospace, monospace;
        font-size: calc(12.5px * var(--mh-text-scale, 1));
        white-space: pre-wrap;
      }
      #mh-feedback-privacy {
        color: var(--muted);
        font-size: calc(12px * var(--mh-text-scale, 1));
        margin: 10px 0 6px;
      }
      #mh-feedback-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      #mh-feedback-actions a {
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-feedback-actions a:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      #mh-feedback-actions #mh-feedback-github {
        background: var(--yellow);
        border-color: var(--yellow);
        color: var(--ink);
        box-shadow: 0 3px #b88a00;
      }
      #mh-feedback-actions #mh-feedback-github:hover {
        color: var(--ink);
      }
      #mh-feedback-box > button {
        margin-top: 12px;
        background: #ffffff14;
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--r);
        padding: 6px 14px;
        cursor: pointer;
        font: 800 calc(12.5px * var(--mh-text-scale, 1)) var(--display);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      #mh-feedback-box > button:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* Reduced-flash (M5/T1): with the body class on (the ⚙ Access toggle),
         every overlay and banner fades in and out over ≥300ms instead of
         appearing at once, and every panel/boot animation stands still. A
         [hidden] overlay keeps its layout box but goes fully transparent and
         inert — opacity transitions, display cannot. M5/T6: a faded overlay
         also drops to visibility:hidden — but only AFTER the 320ms fade
         (visibility flips on a 0s transition delayed to the fade's end), so
         the fade still shows while a faded overlay is no longer a pile of
         ghost tab stops for the keyboard. The shown rules never transition
         visibility, so it snaps back visible at once. */
      body.mh-reduced-flash #mh-faq-box,
      body.mh-reduced-flash #mh-settings-box,
      body.mh-reduced-flash #mh-about-box,
      body.mh-reduced-flash #mh-feedback-box,
      body.mh-reduced-flash #mh-tier-box,
      body.mh-reduced-flash #mh-aaina-box,
      body.mh-reduced-flash #mh-boot {
        animation: none;
      }
      body.mh-reduced-flash #mh-faq-overlay,
      body.mh-reduced-flash #mh-settings-overlay,
      body.mh-reduced-flash #mh-about-overlay,
      body.mh-reduced-flash #mh-feedback-overlay,
      body.mh-reduced-flash #mh-tier-overlay,
      body.mh-reduced-flash #mh-aaina-overlay,
      body.mh-reduced-flash #mh-cleared,
      body.mh-reduced-flash #mh-descend,
      body.mh-reduced-flash #mh-shard,
      body.mh-reduced-flash #mh-act,
      body.mh-reduced-flash #mh-fail,
      body.mh-reduced-flash #mh-hint,
      body.mh-reduced-flash #mh-toast,
      body.mh-reduced-flash #mh-venue,
      body.mh-reduced-flash #mh-captions,
      body.mh-reduced-flash #mh-tester-banner,
      body.mh-reduced-flash #mh-boot {
        transition: opacity 320ms ease;
      }
      body.mh-reduced-flash #mh-faq-overlay[hidden],
      body.mh-reduced-flash #mh-settings-overlay[hidden],
      body.mh-reduced-flash #mh-about-overlay[hidden],
      body.mh-reduced-flash #mh-feedback-overlay[hidden],
      body.mh-reduced-flash #mh-tier-overlay[hidden] {
        display: grid; /* keep the box — opacity fades where display cannot */
        opacity: 0;
        pointer-events: none;
        visibility: hidden; /* M5/T6 — a faded overlay owns no tab stops */
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
      body.mh-reduced-flash #mh-aaina-overlay[hidden] {
        display: flex;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
      body.mh-reduced-flash #mh-cleared[hidden],
      body.mh-reduced-flash #mh-descend[hidden],
      body.mh-reduced-flash #mh-shard[hidden],
      body.mh-reduced-flash #mh-act[hidden],
      body.mh-reduced-flash #mh-fail[hidden],
      body.mh-reduced-flash #mh-hint[hidden],
      body.mh-reduced-flash #mh-toast[hidden],
      body.mh-reduced-flash #mh-venue[hidden],
      body.mh-reduced-flash #mh-captions[hidden],
      body.mh-reduced-flash #mh-tester-banner[hidden] {
        display: block;
        opacity: 0;
        pointer-events: none;
        visibility: hidden; /* M5/T6 — a faded overlay owns no tab stops */
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
    </style>
  </head>

    <canvas id="overhead"></canvas>
    <div id="mh-vignette" aria-hidden="true"></div>
    <div id="mh-boot" aria-hidden="true">
      <div class="mh-boot-kicker">Mirror</div>
      <div class="mh-boot-title">House</div>
      <p class="mh-boot-tagline">Fog the glass. Outthink what hunts you. Descend.</p>
    </div>
    <div id="diagnostics"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
