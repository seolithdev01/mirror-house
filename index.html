<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- M4/T5 — PWA wiring: the house installs to the home screen and lives in
         the same indigo night on every OS chrome that reads it. -->
    <meta name="theme-color" content="#0b1026" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Mirror House</title>
    <style>
      /* M5/T1 — the text-scale ladder every HUD/overlay font multiplies in.
         main.ts sets the inline body value from the save (1 | 1.25 | 1.5);
         this default keeps a no-JS first paint at 100%. */
      html {
        --mh-text-scale: 1;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Overhead/tactical map (M3/T4) — a 2D canvas over the paused 3D stage.
         display:none unless the view mode is overhead/tactical (main.ts owns
         the toggle); above #game, below the HUD and diagnostics. */
      #overhead {
        position: fixed;
        inset: 0;
        z-index: 5;
        width: 100vw;
        height: 100vh;
        display: none;
        background: #05060a;
        cursor: crosshair;
      }
      #diagnostics {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        font:
          calc(12px * var(--mh-text-scale, 1))/1.5 ui-monospace,
          monospace;
        color: #9fb4c8;
        background: rgba(5, 6, 10, 0.7);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
      }
      #hud {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        font: calc(13px * var(--mh-text-scale, 1))/1.4 system-ui;
        color: #f2e9d8;
        pointer-events: none;
      }
      #hud button {
        pointer-events: auto;
        cursor: pointer;
        background: rgba(11, 16, 38, 0.8);
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 4px 10px;
        margin-left: 4px;
      }
      #hud button.active {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #hud button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #mh-breath {
        width: 150px;
        height: 10px;
        margin-right: 4px;
        background: rgba(11, 16, 38, 0.8);
        border: 1px solid #2a3560;
        border-radius: 5px;
        overflow: hidden;
      }
      #mh-breath-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #9fd8ff, #d7f1ff);
        transition: width 0.15s linear;
      }
      #mh-anger {
        width: 150px;
        height: 10px;
        margin-right: 4px;
        background: rgba(11, 16, 38, 0.8);
        border: 1px solid #2a3560;
        border-radius: 5px;
        overflow: hidden;
      }
      #mh-anger-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7a2f35, #e07a5f);
        transition: width 0.15s linear;
      }
      #mh-chips {
        display: flex;
        gap: 8px;
        background: rgba(11, 16, 38, 0.7);
        border-radius: 6px;
        padding: 4px 10px;
      }
      /* M4/T6 — chips are single-line in every language; long labels move the
         row wider instead of wrapping mid-chip. */
      .mh-chip {
        white-space: nowrap;
      }
      #mh-cleared {
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #d9a441;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: calc(15px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      /* M4/T2 — the brief `descending…` banner between floors (auto-hides when
         the next floor arms). */
      #mh-descend {
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #2ec4b6;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: calc(15px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      #mh-descend[hidden] {
        display: none;
      }
      /* M4/T2 — tier-complete screen: Truth-Shard I, final stats, Play again /
         Stay. A modal in the FAQ's image, above the HUD. */
      #mh-tier-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-tier-overlay[hidden] {
        display: none;
      }
      #mh-tier-box {
        background: #0b1026;
        border: 1px solid #d9a441;
        border-radius: 10px;
        padding: 24px 30px;
        color: #f2e9d8;
        font: calc(15px * var(--mh-text-scale, 1))/1.6 system-ui;
        text-align: center;
        max-width: 480px;
      }
      #mh-tier-box h2 {
        margin: 0 0 10px;
        color: #d9a441;
        font-size: calc(19px * var(--mh-text-scale, 1));
      }
      #mh-tier-box p {
        margin: 6px 0;
      }
      #mh-tier-note {
        color: #9fb4c8;
        font-size: calc(13px * var(--mh-text-scale, 1));
      }
      #mh-tier-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 14px 0 4px;
      }
      #mh-tier-buttons button {
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #mh-tier-buttons button:hover {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #mh-fail {
        background: rgba(26, 10, 14, 0.92);
        border: 1px solid #b33939;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: calc(15px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      #mh-fail[hidden] {
        display: none;
      }
      #mh-hint {
        background: rgba(11, 16, 38, 0.85);
        border: 1px solid #2a3560;
        color: #f2e9d8;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: calc(13px * var(--mh-text-scale, 1));
        max-width: 360px;
        pointer-events: none;
      }
      #mh-hint[hidden] {
        display: none;
      }
      /* M4/T4 — short-lived notices (import rejections, export confirmations).
         Gold-edged like the cleared banner: it speaks for the save, not the
         floor. Auto-hides from hud.ts after 2.5s. */
      #mh-toast {
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #d9a441;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: calc(13px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      #mh-toast[hidden] {
        display: none;
      }
      #mh-faq-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-faq-overlay[hidden] {
        display: none;
      }
      #mh-faq-box {
        max-width: 640px;
        max-height: 82vh;
        overflow: auto;
        background: #0b1026;
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 20px 26px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
      }
      #mh-faq-box h2 {
        margin: 0 0 12px;
        color: #d9a441;
        font-size: calc(18px * var(--mh-text-scale, 1));
      }
      #mh-faq-box details {
        border-bottom: 1px solid #1d2440;
        padding: 8px 0;
      }
      #mh-faq-box summary {
        cursor: pointer;
        color: #2ec4b6;
      }
      #mh-faq-box button {
        margin-top: 14px;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* Aaina (M3) — the FAQ's diegetic sister: same box styling, docked beside
         the maze instead of a centered pause, so the floor stays visible and
         live while the lantern talks. */
      #mh-aaina-overlay {
        position: fixed;
        left: 8px;
        top: 76px;
        bottom: 8px;
        width: min(400px, 92vw);
        z-index: 20;
        display: flex;
        pointer-events: auto;
      }
      #mh-aaina-overlay[hidden] {
        display: none;
      }
      #mh-aaina-box {
        flex: 1;
        overflow: auto;
        background: rgba(11, 16, 38, 0.94);
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 16px 20px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #mh-aaina-box h2 {
        margin: 0;
        color: #d9a441;
        font-size: calc(17px * var(--mh-text-scale, 1));
      }
      #mh-aaina-tabs {
        display: flex;
        gap: 6px;
      }
      #mh-aaina-tabs button {
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      #mh-aaina-tabs button.active {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #mh-aaina-box details {
        border-bottom: 1px solid #1d2440;
        padding: 6px 0;
      }
      #mh-aaina-box summary {
        cursor: pointer;
        color: #2ec4b6;
      }
      #mh-aaina-hint-text {
        white-space: pre-wrap;
      }
      #mh-aaina-buy {
        align-self: flex-start;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      #mh-aaina-buy:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #mh-aaina-lore-count {
        color: #d9a441;
        margin: 0;
      }
      #mh-aaina-lore-list p {
        margin: 6px 0;
      }
      #mh-aaina-lore-list p.locked {
        color: #6b7280;
        font-style: italic;
      }
      #mh-aaina-close {
        align-self: flex-start;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* ⚙ Settings (M5/T1) — the FAQ overlay's modal shape. Two sections this
         milestone: Display (text scale radio) and Access (reduced-flash +
         captions toggles). Performance lands in T4 and Controls in T2 — no
         stub sections until then. */
      #mh-settings-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-settings-overlay[hidden] {
        display: none;
      }
      #mh-settings-box {
        min-width: 300px;
        max-width: 440px;
        background: #0b1026;
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 20px 26px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
      }
      #mh-settings-box h2 {
        margin: 0 0 12px;
        color: #d9a441;
        font-size: calc(18px * var(--mh-text-scale, 1));
      }
      #mh-settings-box h3 {
        margin: 12px 0 6px;
        color: #2ec4b6;
        font-size: calc(15px * var(--mh-text-scale, 1));
      }
      #mh-settings-box fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }
      #mh-settings-box legend {
        padding: 0;
        color: #f2e9d8;
      }
      #mh-settings-box label {
        display: block;
        margin: 4px 0;
        cursor: pointer;
      }
      #mh-settings-box .mh-settings-note {
        margin: 2px 0 8px;
        color: #9fb4c8;
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-settings-box button {
        margin-top: 10px;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* Reduced-flash (M5/T1): with the body class on (the ⚙ Access toggle),
         every overlay and banner fades in and out over ≥300ms instead of
         appearing at once. A [hidden] overlay keeps its layout box but goes
         fully transparent and inert — opacity transitions, display cannot. */
      body.mh-reduced-flash #mh-faq-overlay,
      body.mh-reduced-flash #mh-settings-overlay,
      body.mh-reduced-flash #mh-tier-overlay,
      body.mh-reduced-flash #mh-aaina-overlay,
      body.mh-reduced-flash #mh-cleared,
      body.mh-reduced-flash #mh-descend,
      body.mh-reduced-flash #mh-fail,
      body.mh-reduced-flash #mh-hint,
      body.mh-reduced-flash #mh-toast {
        transition: opacity 320ms ease;
      }
      body.mh-reduced-flash #mh-faq-overlay[hidden],
      body.mh-reduced-flash #mh-settings-overlay[hidden],
      body.mh-reduced-flash #mh-tier-overlay[hidden] {
        display: grid; /* keep the box — opacity fades where display cannot */
        opacity: 0;
        pointer-events: none;
      }
      body.mh-reduced-flash #mh-aaina-overlay[hidden] {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }
      body.mh-reduced-flash #mh-cleared[hidden],
      body.mh-reduced-flash #mh-descend[hidden],
      body.mh-reduced-flash #mh-fail[hidden],
      body.mh-reduced-flash #mh-hint[hidden],
      body.mh-reduced-flash #mh-toast[hidden] {
        display: block;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="overhead"></canvas>
    <div id="diagnostics"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
