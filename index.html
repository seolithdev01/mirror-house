<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- M4/T5 — PWA wiring: the house installs to the home screen and lives in
         the same indigo night on every OS chrome that reads it. -->
    <meta name="theme-color" content="#0b1026" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Mirror House</title>
    <!-- step007/T1 — launch meta: the one-line pitch for crawlers and share
         cards. og:image is a DIRECT PNG url (crawlers do not run JS and most
         do not follow /assets hashes) — public/og-image.png, a copy of
         store-assets/icon-512.png committed at the repo root, referenced
         absolutely against the production origin. -->
    <meta
      name="description"
      content="Escape a century-old palace of mirrors: fog the glass, outthink what hunts you, descend. Free, open source, offline — your data never leaves your device."
    />
    <meta property="og:title" content="Mirror House" />
    <meta
      property="og:description"
      content="Escape a century-old palace of mirrors: fog the glass, outthink what hunts you, descend. Free, open source, offline — your data never leaves your device."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mirror-house-8fg.pages.dev/" />
    <meta property="og:image" content="https://mirror-house-8fg.pages.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* M5/T1 — the text-scale ladder every HUD/overlay font multiplies in.
         main.ts sets the inline body value from the save (1 | 1.25 | 1.5);
         this default keeps a no-JS first paint at 100%. */
      html {
        --mh-text-scale: 1;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Overhead/tactical map (M3/T4) — a 2D canvas over the paused 3D stage.
         display:none unless the view mode is overhead/tactical (main.ts owns
         the toggle); above #game, below the HUD and diagnostics. */
      #overhead {
        position: fixed;
        inset: 0;
        z-index: 5;
        width: 100vw;
        height: 100vh;
        display: none;
        background: #05060a;
        cursor: crosshair;
      }
      #diagnostics {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        font:
          calc(12px * var(--mh-text-scale, 1))/1.5 ui-monospace,
          monospace;
        color: #9fb4c8;
        background: rgba(5, 6, 10, 0.7);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
      }
      /* step007/T3 — the TESTER chip (?test=1 only; main.ts creates it, so a
         default load never carries the element): the diagnostics chip's
         styling docked bottom-left, teal text naming its nature. */
      #mh-tester {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 10;
        font:
          calc(12px * var(--mh-text-scale, 1))/1.5 ui-monospace,
          monospace;
        color: #2ec4b6;
        background: rgba(5, 6, 10, 0.7);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
      }
      /* step007/T3 — tester mode's one-time banner: top-center, teal-edged
         like the diagnostics family; main.ts flips [hidden] after 6s. */
      #mh-tester-banner {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        max-width: min(480px, 90vw);
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #2ec4b6;
        border-radius: 8px;
        padding: 8px 14px;
        font: calc(13px * var(--mh-text-scale, 1))/1.5 system-ui;
        color: #f2e9d8;
        text-align: center;
        pointer-events: none;
      }
      #mh-tester-banner[hidden] {
        display: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        font: calc(13px * var(--mh-text-scale, 1))/1.4 system-ui;
        color: #f2e9d8;
        pointer-events: none;
      }
      #hud button {
        pointer-events: auto;
        cursor: pointer;
        background: rgba(11, 16, 38, 0.8);
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 4px 10px;
        margin-left: 4px;
      }
      #hud button.active {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #hud button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #mh-breath {
        width: 150px;
        height: 10px;
        margin-right: 4px;
        background: rgba(11, 16, 38, 0.8);
        border: 1px solid #2a3560;
        border-radius: 5px;
        overflow: hidden;
      }
      #mh-breath-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #9fd8ff, #d7f1ff);
        transition: width 0.15s linear;
      }
      #mh-anger {
        width: 150px;
        height: 10px;
        margin-right: 4px;
        background: rgba(11, 16, 38, 0.8);
        border: 1px solid #2a3560;
        border-radius: 5px;
        overflow: hidden;
      }
      #mh-anger-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7a2f35, #e07a5f);
        transition: width 0.15s linear;
      }
      #mh-chips {
        display: flex;
        gap: 8px;
        background: rgba(11, 16, 38, 0.7);
        border-radius: 6px;
        padding: 4px 10px;
      }
      /* M6/T1 — the venue side-floor banner: pack name, its tagline, the
         no-banking note, and the return button. Rose-edged (the pack's
         primary accent family) so a sponsored floor reads at a glance; the
         card rides the pointer-events:none HUD column, its button alone owns
         clicks. */
      #mh-venue {
        max-width: 300px;
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #c2548a;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: calc(13px * var(--mh-text-scale, 1));
        text-align: right;
      }
      #mh-venue[hidden] {
        display: none;
      }
      #mh-venue p {
        margin: 2px 0;
        color: #f2e9d8;
      }
      #mh-venue .mh-venue-note {
        color: #9fb4c8;
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-venue button {
        pointer-events: auto;
        cursor: pointer;
        margin: 4px 0 0;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #c2548a;
        border-radius: 6px;
        padding: 4px 10px;
      }
      #mh-venue button:hover {
        border-color: #d9a441;
        color: #d9a441;
      }
      /* M4/T6 — chips are single-line in every language; long labels move the
         row wider instead of wrapping mid-chip. */
      .mh-chip {
        white-space: nowrap;
      }
      #mh-cleared {
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #d9a441;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: calc(15px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      /* M4/T2 — the brief `descending…` banner between floors (auto-hides when
         the next floor arms). */
      #mh-descend {
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #2ec4b6;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: calc(15px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      #mh-descend[hidden] {
        display: none;
      }
      /* T2/T5 — the Truth-Shard I interstitial (the T1 adjudication): the
         tier-complete card's visual language — indigo card, gold border,
         gold line — as a centered banner that auto-dismisses from hud.ts
         after 1.8s. No backdrop and no pointer events: the 0.8s descend
         beneath it keeps running, and only Dwaar II (floor 20) raises the
         full tier screen. */
      #mh-shard {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
        max-width: min(480px, 90vw);
        background: #0b1026;
        border: 1px solid #d9a441;
        border-radius: 10px;
        padding: 18px 26px;
        color: #d9a441;
        font: calc(19px * var(--mh-text-scale, 1))/1.6 system-ui;
        text-align: center;
        pointer-events: none;
      }
      #mh-shard[hidden] {
        display: none;
      }
      /* T5/T1 — the Act II opening banner: the act's name over its one-line
         threat ("The house has begun copying you."), the shard interstitial's
         centered-card shape dressed in the act close's rose — the act-turn
         tint (T4/T1's `.act` family). Auto-dismisses from hud.ts after 3s;
         raised once per session on the first floor-41 build. */
      #mh-act {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
        max-width: min(480px, 90vw);
        background: #0b1026;
        border: 1px solid #c2548a;
        border-radius: 10px;
        padding: 16px 26px 14px;
        color: #f2e9d8;
        font: calc(15px * var(--mh-text-scale, 1))/1.6 system-ui;
        text-align: center;
        pointer-events: none;
      }
      #mh-act-title {
        color: #c2548a;
        font-size: calc(20px * var(--mh-text-scale, 1));
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      #mh-act-note {
        margin: 6px 0 0;
        color: #9fb4c8;
      }
      #mh-act[hidden] {
        display: none;
      }
      /* M4/T2 — tier-complete screen: Truth-Shard I, final stats, Play again /
         Stay. A modal in the FAQ's image, above the HUD. */
      #mh-tier-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-tier-overlay[hidden] {
        display: none;
      }
      #mh-tier-box {
        background: #0b1026;
        border: 1px solid #d9a441;
        border-radius: 10px;
        padding: 24px 30px;
        color: #f2e9d8;
        font: calc(15px * var(--mh-text-scale, 1))/1.6 system-ui;
        text-align: center;
        max-width: 480px;
      }
      #mh-tier-box h2 {
        margin: 0 0 10px;
        color: #d9a441;
        font-size: calc(19px * var(--mh-text-scale, 1));
      }
      #mh-tier-box p {
        margin: 6px 0;
      }
      #mh-tier-note {
        color: #9fb4c8;
        font-size: calc(13px * var(--mh-text-scale, 1));
      }
      /* T4/T1 — the ACT I completion screen Dwaar IV raises: the same
         tier-complete card dressed in the carnival's rose (the act close, not
         a tier screen — gold stays the tiers'). */
      #mh-tier-box.act {
        border-color: #c2548a;
        box-shadow: 0 0 28px rgba(194, 84, 138, 0.35);
      }
      #mh-tier-box.act h2 {
        color: #c2548a;
        letter-spacing: 0.08em;
      }
      #mh-tier-box.act #mh-tier-note {
        color: #d9a441;
      }
      #mh-tier-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 14px 0 4px;
      }
      #mh-tier-buttons button {
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #mh-tier-buttons button:hover {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #mh-fail {
        background: rgba(26, 10, 14, 0.92);
        border: 1px solid #b33939;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: calc(15px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      #mh-fail[hidden] {
        display: none;
      }
      #mh-hint {
        background: rgba(11, 16, 38, 0.85);
        border: 1px solid #2a3560;
        color: #f2e9d8;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: calc(13px * var(--mh-text-scale, 1));
        max-width: 360px;
        pointer-events: none;
      }
      #mh-hint[hidden] {
        display: none;
      }
      /* M4/T4 — short-lived notices (import rejections, export confirmations).
         Gold-edged like the cleared banner: it speaks for the save, not the
         floor. Auto-hides from hud.ts after 2.5s. */
      #mh-toast {
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #d9a441;
        color: #f2e9d8;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: calc(13px * var(--mh-text-scale, 1));
        pointer-events: none;
      }
      #mh-toast[hidden] {
        display: none;
      }
      /* M5/T3 — the caption bar: bottom-center, the latest two sound-cue
         lines (renderCaptions joins them with \n; pre-line stacks them).
         Fixed inside the pointer-events:none #hud root, so it centres on the
         viewport whatever the column does, and its font rides the text-scale
         ladder like every HUD surface. */
      #mh-captions {
        position: fixed;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(560px, 90vw);
        background: rgba(5, 6, 10, 0.72);
        border: 1px solid #2a3560;
        border-radius: 8px;
        padding: 8px 14px;
        font: calc(15px * var(--mh-text-scale, 1))/1.5 system-ui;
        color: #f2e9d8;
        text-align: center;
        white-space: pre-line;
        pointer-events: none;
      }
      #mh-captions[hidden] {
        display: none;
      }
      #mh-faq-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-faq-overlay[hidden] {
        display: none;
      }
      #mh-faq-box {
        max-width: 640px;
        max-height: 82vh;
        overflow: auto;
        background: #0b1026;
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 20px 26px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
      }
      #mh-faq-box h2 {
        margin: 0 0 12px;
        color: #d9a441;
        font-size: calc(18px * var(--mh-text-scale, 1));
      }
      #mh-faq-box details {
        border-bottom: 1px solid #1d2440;
        padding: 8px 0;
      }
      #mh-faq-box summary {
        cursor: pointer;
        color: #2ec4b6;
      }
      #mh-faq-box button {
        margin-top: 14px;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* Aaina (M3) — the FAQ's diegetic sister: same box styling, docked beside
         the maze instead of a centered pause, so the floor stays visible and
         live while the lantern talks. */
      #mh-aaina-overlay {
        position: fixed;
        left: 8px;
        top: 76px;
        bottom: 8px;
        width: min(400px, 92vw);
        z-index: 20;
        display: flex;
        pointer-events: auto;
      }
      #mh-aaina-overlay[hidden] {
        display: none;
      }
      #mh-aaina-box {
        flex: 1;
        overflow: auto;
        background: rgba(11, 16, 38, 0.94);
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 16px 20px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #mh-aaina-box h2 {
        margin: 0;
        color: #d9a441;
        font-size: calc(17px * var(--mh-text-scale, 1));
      }
      #mh-aaina-tabs {
        display: flex;
        gap: 6px;
      }
      #mh-aaina-tabs button {
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      #mh-aaina-tabs button.active {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #mh-aaina-box details {
        border-bottom: 1px solid #1d2440;
        padding: 6px 0;
      }
      #mh-aaina-box summary {
        cursor: pointer;
        color: #2ec4b6;
      }
      #mh-aaina-hint-text {
        white-space: pre-wrap;
      }
      #mh-aaina-buy {
        align-self: flex-start;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      #mh-aaina-buy:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #mh-aaina-lore-count {
        color: #d9a441;
        margin: 0;
      }
      #mh-aaina-lore-list p {
        margin: 6px 0;
      }
      #mh-aaina-lore-list p.locked {
        color: #6b7280;
        font-style: italic;
      }
      #mh-aaina-close {
        align-self: flex-start;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* ⚙ Settings (M5/T1) — the FAQ overlay's modal shape. Two sections this
         milestone: Display (text scale radio) and Access (reduced-flash +
         captions toggles). Performance lands in T4 and Controls in T2 — no
         stub sections until then. */
      #mh-settings-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-settings-overlay[hidden] {
        display: none;
      }
      #mh-settings-box {
        min-width: 300px;
        max-width: 440px;
        max-height: 82vh;
        overflow: auto;
        background: #0b1026;
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 20px 26px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
      }
      #mh-settings-box h2 {
        margin: 0 0 12px;
        color: #d9a441;
        font-size: calc(18px * var(--mh-text-scale, 1));
      }
      #mh-settings-box h3 {
        margin: 12px 0 6px;
        color: #2ec4b6;
        font-size: calc(15px * var(--mh-text-scale, 1));
      }
      #mh-settings-box fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }
      #mh-settings-box legend {
        padding: 0;
        color: #f2e9d8;
      }
      #mh-settings-box label {
        display: block;
        margin: 4px 0;
        cursor: pointer;
      }
      #mh-settings-box .mh-settings-note {
        margin: 2px 0 8px;
        color: #9fb4c8;
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-settings-box button {
        margin-top: 10px;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* M5/T2 — Controls rows: action label left, the bound key right. Click
         arms the capture (gold italic "press a key…"), the next keydown
         rebinds through the conflict guard; refusals name the owner inline. */
      #mh-settings-box .mh-key-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 0;
      }
      #mh-settings-box .mh-key-label {
        flex: 1;
      }
      #mh-settings-box .mh-key-btn {
        margin-top: 0;
        min-width: 76px;
        padding: 3px 10px;
        font-family: ui-monospace, monospace;
        text-align: center;
      }
      #mh-settings-box .mh-key-btn.mh-key-capturing {
        border-color: #d9a441;
        color: #d9a441;
        font-style: italic;
      }
      #mh-keymap-msg.mh-key-conflict {
        color: #e07a5f;
      }
      /* M6/T1 — the Floors section's venue card: one bordered card naming the
         DEMO pack, its Play/Return button, and the never-touches note. */
      #mh-settings-box .mh-venue-card {
        border: 1px solid #2a3560;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 4px 0 8px;
      }
      #mh-settings-box .mh-venue-card .mh-venue-name {
        color: #f2e9d8;
      }
      #mh-settings-box .mh-venue-card button {
        margin-top: 6px;
      }
      /* step007/T1 — the About overlay: the settings modal's shape (centered,
         gold-titled box), holding the version line, the two-line pitch, the
         beta/credits notes, the four launch links and the tagline. */
      #mh-about-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-about-overlay[hidden] {
        display: none;
      }
      #mh-about-box {
        min-width: 300px;
        max-width: 480px;
        max-height: 82vh;
        overflow: auto;
        background: #0b1026;
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 20px 26px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
      }
      #mh-about-box h2 {
        margin: 0 0 6px;
        color: #d9a441;
        font-size: calc(18px * var(--mh-text-scale, 1));
      }
      #mh-about-version {
        margin: 0 0 10px;
        color: #9fb4c8;
        font-family: ui-monospace, monospace;
        font-size: calc(12px * var(--mh-text-scale, 1));
      }
      #mh-about-box p {
        margin: 8px 0;
      }
      #mh-about-links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin: 12px 0 4px;
      }
      #mh-about-links a {
        color: #2ec4b6;
      }
      #mh-about-tagline {
        color: #9fb4c8;
        font-style: italic;
      }
      #mh-about-box button {
        margin-top: 12px;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* step007/T2 — the 📮 feedback composer: the About modal's shape holding
         a form — the kind radio (🐞/💡/💙), the short title, the body textarea
         (prompt + diagnostics prefilled, monospace so the block reads), the
         privacy line, and the two exit anchors. */
      #mh-feedback-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 8, 20, 0.82);
        display: grid;
        place-items: center;
      }
      #mh-feedback-overlay[hidden] {
        display: none;
      }
      #mh-feedback-box {
        min-width: 300px;
        max-width: 560px;
        max-height: 86vh;
        overflow: auto;
        background: #0b1026;
        border: 1px solid #2a3560;
        border-radius: 10px;
        padding: 20px 26px;
        color: #f2e9d8;
        font: calc(14px * var(--mh-text-scale, 1))/1.6 system-ui;
      }
      #mh-feedback-box h2 {
        margin: 0 0 8px;
        color: #d9a441;
        font-size: calc(18px * var(--mh-text-scale, 1));
      }
      #mh-feedback-kind {
        border: 0;
        padding: 0;
        margin: 0 0 6px;
      }
      #mh-feedback-kind legend {
        color: #9fb4c8;
        padding: 0;
        margin-bottom: 4px;
      }
      #mh-feedback-kind label {
        display: inline-block;
        margin: 0 14px 0 0;
        white-space: nowrap;
      }
      #mh-feedback-box label {
        display: block;
        margin: 6px 0 2px;
        color: #9fb4c8;
      }
      #mh-feedback-kind label {
        color: inherit;
      }
      #mh-feedback-summary,
      #mh-feedback-body {
        width: 100%;
        box-sizing: border-box;
        background: #101736;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        font: inherit;
        padding: 6px 8px;
      }
      #mh-feedback-body {
        resize: vertical;
        min-height: 9em;
        font-family: ui-monospace, monospace;
        font-size: calc(12.5px * var(--mh-text-scale, 1));
        white-space: pre-wrap;
      }
      #mh-feedback-privacy {
        color: #9fb4c8;
        font-size: calc(12px * var(--mh-text-scale, 1));
        margin: 10px 0 6px;
      }
      #mh-feedback-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      #mh-feedback-actions a {
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
      }
      #mh-feedback-actions #mh-feedback-github {
        border-color: #2ec4b6;
        color: #2ec4b6;
      }
      #mh-feedback-box > button {
        margin-top: 12px;
        background: #1d2440;
        color: #f2e9d8;
        border: 1px solid #2a3560;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      /* Reduced-flash (M5/T1): with the body class on (the ⚙ Access toggle),
         every overlay and banner fades in and out over ≥300ms instead of
         appearing at once. A [hidden] overlay keeps its layout box but goes
         fully transparent and inert — opacity transitions, display cannot.
         M5/T6: a faded overlay also drops to visibility:hidden — but only
         AFTER the 320ms fade (visibility flips on a 0s transition delayed to
         the fade's end), so the fade still shows while a faded overlay is no
         longer a pile of ghost tab stops for the keyboard. The shown rules
         never transition visibility, so it snaps back visible at once. */
      body.mh-reduced-flash #mh-faq-overlay,
      body.mh-reduced-flash #mh-settings-overlay,
      body.mh-reduced-flash #mh-about-overlay,
      body.mh-reduced-flash #mh-feedback-overlay,
      body.mh-reduced-flash #mh-tier-overlay,
      body.mh-reduced-flash #mh-aaina-overlay,
      body.mh-reduced-flash #mh-cleared,
      body.mh-reduced-flash #mh-descend,
      body.mh-reduced-flash #mh-shard,
      body.mh-reduced-flash #mh-act,
      body.mh-reduced-flash #mh-fail,
      body.mh-reduced-flash #mh-hint,
      body.mh-reduced-flash #mh-toast,
      body.mh-reduced-flash #mh-venue,
      body.mh-reduced-flash #mh-captions,
      body.mh-reduced-flash #mh-tester-banner {
        transition: opacity 320ms ease;
      }
      body.mh-reduced-flash #mh-faq-overlay[hidden],
      body.mh-reduced-flash #mh-settings-overlay[hidden],
      body.mh-reduced-flash #mh-about-overlay[hidden],
      body.mh-reduced-flash #mh-feedback-overlay[hidden],
      body.mh-reduced-flash #mh-tier-overlay[hidden] {
        display: grid; /* keep the box — opacity fades where display cannot */
        opacity: 0;
        pointer-events: none;
        visibility: hidden; /* M5/T6 — a faded overlay owns no tab stops */
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
      body.mh-reduced-flash #mh-aaina-overlay[hidden] {
        display: flex;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
      body.mh-reduced-flash #mh-cleared[hidden],
      body.mh-reduced-flash #mh-descend[hidden],
      body.mh-reduced-flash #mh-shard[hidden],
      body.mh-reduced-flash #mh-act[hidden],
      body.mh-reduced-flash #mh-fail[hidden],
      body.mh-reduced-flash #mh-hint[hidden],
      body.mh-reduced-flash #mh-toast[hidden],
      body.mh-reduced-flash #mh-venue[hidden],
      body.mh-reduced-flash #mh-captions[hidden],
      body.mh-reduced-flash #mh-tester-banner[hidden] {
        display: block;
        opacity: 0;
        pointer-events: none;
        visibility: hidden; /* M5/T6 — a faded overlay owns no tab stops */
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="overhead"></canvas>
    <div id="diagnostics"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
